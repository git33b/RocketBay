<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1026" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RocketBay" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Build a rocket from modular parts and launch it." />
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>RocketBay</title>
  <style>
    :root { color-scheme: dark; --accent: #ff8c00; --cyan: #00c8e0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: #000; color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden; user-select: none;
    }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    #plate {
      position: absolute; left: 0; top: 0;
      width: 100%; height: 100%;
      object-fit: fill; /* size box set by JS plateMap (cover) */
      background: transparent; display: block;
      image-rendering: auto;
    }
    #skyExt {
      position: absolute; left: 0; right: 0; top: -200%; bottom: -50%;
      pointer-events: none; z-index: 0;
      opacity: 0; transition: none;
      image-rendering: pixelated;
    }
    #skyExt canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    #parallax {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      image-rendering: pixelated;
    }
    #world {
      position: absolute; inset: 0; z-index: 1;
      will-change: transform;
      transform: translate3d(0,0,0);
      overflow: visible;
    }
    #plateWrap {
      position: absolute; inset: 0;
      overflow: hidden; /* cover crop */
    }
    #plateWrap.liftoffClimb, #plateWrap.assembleOpen {
      overflow: visible;
    }
    #stack {
      position: absolute; pointer-events: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: none;
      transform-origin: 50% 100%;
      opacity: 1;
      mix-blend-mode: normal;
      will-change: transform;
    }
    #stack.on { display: block; }
    #fxCanvas {
      position: absolute; pointer-events: none;
      display: none; z-index: 4;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      will-change: transform;
      transform-origin: 50% 100%;
    }
    #chrome.liftoffHidden {
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 110%, 0);
      transition: opacity 0.2s, transform 0.25s;
    }
    #countdownHud {
      position: absolute; top: calc(4px + env(safe-area-inset-top)); left: 0; right: 0;
      z-index: 6; pointer-events: none;
      display: none; text-align: center;
      font-size: clamp(14px, 3.2vw, 22px); font-weight: 900;
      letter-spacing: 0.16em; color: #ffe8a0;
      text-shadow: 0 0 8px rgba(255,120,0,.9), 0 1px 0 #000;
    }
    #hud {
      position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 10px; right: 10px;
      display: flex; justify-content: space-between; gap: 8px; pointer-events: none;
    }
    #hud .pill {
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px; padding: 6px 8px; font-size: 10px; line-height: 1.35;
      max-width: 58%;
    }
    #chrome {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,.92) 28%);
      display: flex; flex-direction: column; gap: 8px;
      max-height: 48vh; overflow: auto;
    }
    .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; align-items: center; }
    button, .chip {
      appearance: none; border: 0; border-radius: 6px;
      padding: 9px 11px; font: inherit; font-size: 11px; font-weight: 700;
      color: #fff; background: rgba(255,255,255,.14); cursor: pointer;
    }
    button.active, .chip.active { background: rgba(255,140,0,.92); }
    button.primary { background: rgba(255,140,0,.92); min-width: 140px; }
    button.primary:disabled { background: rgba(120,120,120,.45); cursor: not-allowed; }
    button.cyan { background: rgba(0,180,220,.45); }
    button.ghost { background: rgba(255,255,255,.1); }
    /* ---- MODULAR-BUILD step builder (phone first) ---- */
    #steps { display: flex; gap: 5px; justify-content: center; }
    #steps button { flex: 1 1 0; min-width: 0; padding: 7px 4px; font-size: 10px; letter-spacing: .02em; white-space: nowrap; }
    #steps button.done::after { content: " \2713"; color: #7dffa8; }
    #steps button.active { background: rgba(0,200,224,.55); }
    #tray {
      display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 4px; scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch; min-height: 76px;
    }
    .card {
      position: relative; flex: 0 0 auto; width: 74px; height: 76px; padding: 3px 3px 4px;
      background: rgba(255,255,255,.1); border-radius: 8px; scroll-snap-align: start;
      border: 2px solid transparent; text-align: center; display: flex; flex-direction: column; align-items: center;
    }
    .card.selected { border-color: var(--cyan); background: rgba(0,200,224,.22); }
    .card.blocked { opacity: .42; filter: grayscale(1); cursor: help; }
    #trayWrap { position: relative; }
    #trayWrap::before, #trayWrap::after {
      content: ""; position: absolute; top: 0; bottom: 4px; width: 34px; pointer-events: none; z-index: 2;
      opacity: 0; transition: opacity .2s;
    }
    #trayWrap::before { left: 0; background: linear-gradient(to right, rgba(8,12,20,.95), rgba(8,12,20,0)); }
    #trayWrap::after { right: 0; background: linear-gradient(to left, rgba(8,12,20,.95), rgba(8,12,20,0)); }
    #trayWrap.moreL::before, #trayWrap.moreR::after { opacity: 1; }
    .trayArrow {
      position: absolute; top: 50%; transform: translateY(-60%); z-index: 3; width: 24px; height: 40px; padding: 0;
      border-radius: 12px; border: 0; background: rgba(0,200,224,.85); color: #041018; font-size: 20px; line-height: 38px;
      font-weight: 700; display: none; box-shadow: 0 0 8px rgba(0,0,0,.5);
    }
    .trayArrow.left { left: 2px; } .trayArrow.right { right: 2px; }
    #trayWrap.moreL .trayArrow.left, #trayWrap.moreR .trayArrow.right { display: block; }
    #buildLabel {
      position: fixed; left: calc(6px + env(safe-area-inset-left)); top: calc(4px + env(safe-area-inset-top)); z-index: 40;
      font: 700 9px/1 ui-monospace, Menlo, monospace; letter-spacing: .5px; color: rgba(255,255,255,.72);
      background: rgba(0,0,0,.35); padding: 3px 5px; border-radius: 4px; pointer-events: none;
    }
    .card.blocked::after {
      content: "\2715"; position: absolute; top: 2px; right: 4px; font-size: 10px; color: #ff8a7a;
    }
    .card.flash { border-color: #ff8a7a; opacity: .75; }
    .card img {
      height: 44px; width: 68px; object-fit: contain; display: block; image-rendering: pixelated;
      background: rgba(0,0,0,.28); border-radius: 4px;
    }
    .card.wide { width: 104px; }
    .card .name { font-size: 9px; margin-top: 3px; line-height: 1.1; font-weight: 700; max-height: 22px; overflow: hidden; }
    #reason {
      height: 26px; font-size: 11px; line-height: 13px; text-align: center; opacity: .95;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    #reason.warn { color: #ffb4a6; }
    #reason.ok { color: #9dfcc0; }
    #actRow button { padding: 9px 10px; }
    #launchBtn { min-width: 128px; }
    #todRow button { min-width: 0; padding: 6px 8px; font-size: 10px; }
    #world.assembleZoom { transition: transform .45s ease; }
    @media (orientation: landscape) and (max-height: 560px) {
      #chrome.building {
        left: auto; right: 0; top: 0; width: 318px; max-height: none;
        background: linear-gradient(90deg, transparent, rgba(0,0,0,.9) 16%);
        padding: 8px 10px 8px 26px; justify-content: flex-end;
      }
    }
    #ops {
      display: none; gap: 6px; flex-wrap: wrap; justify-content: center;
    }
    #ops.on { display: flex; }
    .op {
      font-size: 10px; padding: 6px 8px; border-radius: 999px;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
    }
    .op.done { background: rgba(40,180,90,.35); border-color: rgba(80,220,120,.5); }
    .op.run { background: rgba(255,140,0,.35); border-color: var(--accent); }
    #missionBox, #outcomeBox { display: none; flex-direction: column; gap: 8px; align-items: center; }
    #missionBox.on, #outcomeBox.on { display: flex; }
    #outcomeBox .score {
      font-size: 18px; font-weight: 900; letter-spacing: .06em; color: #ffe08a;
    }
    #meta { text-align: center; font-size: 10px; opacity: .8; letter-spacing: .03em; }
    #soundBtn { min-width: 72px; font-size: 10px; }
    #soundBtn.on { background: rgba(0,180,220,.55); }
    #launchBtn.holding { background: rgba(255,80,0,.95); transform: scale(0.98); }
    #ops .op.big { font-size: 12px; padding: 8px 14px; }
    /* friend-trial: first-screen hint + feedback */
    #firstHint {
      position: fixed; z-index: 45; left: 50%; transform: translateX(-50%);
      top: calc(26px + env(safe-area-inset-top)); width: min(92vw, 420px);
      display: none; align-items: center; gap: 8px; padding: 9px 10px 9px 12px;
      background: rgba(8,14,30,.88); border: 1px solid rgba(0,200,224,.6); border-radius: 10px;
      font: 600 12px/1.35 system-ui, -apple-system, sans-serif; color: #eaf6ff; box-shadow: 0 4px 16px rgba(0,0,0,.45);
    }
    #firstHint.on { display: flex; }
    #firstHint b { color: #ffb14a; }
    #firstHint .txt { flex: 1; }
    #firstHint button { flex: 0 0 auto; border: 0; border-radius: 7px; padding: 6px 10px; background: var(--cyan); color: #041018; font-weight: 800; font-size: 11px; }
    #fbBtn {
      position: fixed; z-index: 44; right: calc(6px + env(safe-area-inset-right)); top: calc(4px + env(safe-area-inset-top));
      border: 1px solid rgba(255,255,255,.35); border-radius: 12px; padding: 4px 9px; background: rgba(0,0,0,.45);
      color: #fff; font: 700 10px/1.2 system-ui, -apple-system, sans-serif; letter-spacing: .3px; display: none;
    }
    #fbBtn.on { display: block; }
    #fbModal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; }
    #fbModal.on { display: flex; }
    #fbCard {
      width: min(94vw, 420px); background: #0d1428; border: 1px solid rgba(0,200,224,.55); border-radius: 12px; padding: 14px;
      color: #eaf6ff; font: 13px/1.4 system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; gap: 8px;
    }
    #fbCard h2 { margin: 0; font-size: 15px; }
    #fbCard .sub { font-size: 11px; opacity: .75; }
    #fbCard textarea, #fbCard input {
      width: 100%; background: #060a16; color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 8px;
      padding: 8px; font: 14px/1.35 system-ui, -apple-system, sans-serif;
    }
    #fbCard textarea { height: 120px; resize: vertical; }
    #fbCard .count { font-size: 10px; opacity: .6; text-align: right; margin-top: -4px; }
    #fbCard .btns { display: flex; gap: 8px; justify-content: flex-end; }
    #fbCard .btns button { border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 800; font-size: 12px; }
    #fbSend { background: var(--accent); color: #1a0d00; }
    #fbSend:disabled { opacity: .5; }
    #fbCancel { background: rgba(255,255,255,.15); color: #fff; }
    #fbStatus { font-size: 12px; min-height: 16px; }
    #fbStatus.ok { color: #9dfcc0; } #fbStatus.err { color: #ffb4a6; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="skyExt" aria-hidden="true"></div>
    <canvas id="parallax" aria-hidden="true"></canvas>
    <div id="countdownHud" aria-live="polite"></div>
    <div id="world">
      <div id="plateWrap">
        <img id="plate" alt="Rocket Bay pad" draggable="false" />
        <canvas id="stack" width="1" height="1" aria-hidden="true"></canvas>
        <canvas id="fxCanvas" width="1" height="1" aria-hidden="true"></canvas>
        <div id="hud">
          <div class="pill" id="stackHud">Select parts</div>
          <div class="pill" id="phaseHud">ASSEMBLE</div>
        </div>
      </div>
    </div>
  </div>

  <div id="buildLabel" aria-hidden="true"></div>
  <div id="firstHint" role="note"><span class="txt">Build your rocket from the parts below, then tap <b>GO FOR LAUNCH</b>.</span><button type="button" id="hintOk">GOT IT</button></div>
  <button type="button" id="fbBtn" aria-haspopup="dialog">Feedback</button>
  <div id="fbModal" role="dialog" aria-modal="true" aria-labelledby="fbTitle">
    <div id="fbCard">
      <h2 id="fbTitle">Send feedback</h2>
      <div class="sub">What worked, what broke, what you'd like. Your build and device info are attached.</div>
      <textarea id="fbText" maxlength="1000" placeholder="Your feedback…"></textarea>
      <div class="count" id="fbCount">0 / 1000</div>
      <input id="fbName" maxlength="40" placeholder="Name (optional)" autocomplete="nickname" />
      <div id="fbStatus" aria-live="polite"></div>
      <div class="btns"><button type="button" id="fbCancel">Close</button><button type="button" id="fbSend">Send</button></div>
    </div>
  </div>
  <div id="chrome">
    <div id="meta"></div>
    <div class="row" id="todRow"></div>

    <div id="assembleUI">
      <div id="steps" role="tablist"></div>
      <div id="trayWrap">
        <div id="tray" aria-label="Pieces"></div>
        <button type="button" class="trayArrow left" id="trayL" aria-label="Scroll pieces left">&#8249;</button>
        <button type="button" class="trayArrow right" id="trayR" aria-label="Scroll pieces right">&#8250;</button>
      </div>
      <div id="reason" aria-live="polite"></div>
      <div class="row" id="actRow">
        <button type="button" class="ghost" id="undoBtn">UNDO</button>
        <button type="button" class="ghost" id="clearBtn">CLEAR</button>
        <button type="button" class="ghost" id="soundBtn" title="Rumble audio (muted by default)">SOUND OFF</button>
        <button type="button" class="primary" id="launchBtn" disabled>GO FOR LAUNCH</button>
      </div>
    </div>

    <div id="ops" class="row" aria-label="Pad ops"></div>

    <div id="missionBox">
      <div class="row">
        <button type="button" class="cyan" id="deployBtn">Deploy payload</button>
        <button type="button" class="cyan" id="exploreBtn">Explore the universe</button>
      </div>
    </div>

    <div id="outcomeBox">
      <div class="score" id="outcomeScore"></div>
      <div id="outcomeText" style="font-size:12px;opacity:.9;text-align:center"></div>
      <button type="button" class="primary" id="restartBtn">FLY AGAIN</button>
    </div>
  </div>

  <script src="pad-config.js?v=pad5v6"></script>
  <script src="modular.js?v=trial1"></script>
  <script src="liftoff.js?v=trial1"></script>
  <script>
    const _padAPI = window.RocketBayPadConfig || {};
    const NATIVE_W = _padAPI.NATIVE_W || 1280, NATIVE_H = _padAPI.NATIVE_H || 720;
    const KIT_VER = "trial1";
    const PAD_VER = "pad5";
    const APP_VER = "trial1";
    const TIP_MIN_Y = 40;          // height budget: stack tip must stay at native y >= 40 at the plate's sit_y
    const MB = window.RocketBayModular;

    function padCfg(todId) {
      if (_padAPI.padFor) return _padAPI.padFor(todId);
      return { cx: 640, sitY: 600, deckY: 600, targetH: 500, nozzleOffsetY: 0, smokeOriginY: 600,
        emptyPad: "plates/empty/" + todId + "-empty-pad-v5.png" };
    }

    const TODS = [
      { id: "02", label: "SUNRISE", file: "sunrise" },
      { id: "03", label: "SUNSET", file: "sunset" },
      { id: "04", label: "NIGHT", file: "night" },
      { id: "05", label: "DAY", file: "day" },
    ];
    const SLOTS = [
      { key: "s1", type: "first_stage", label: "1 FIRST STAGE" },
      { key: "upper", type: "upper", label: "2 UPPER" },
      { key: "payload", type: "payload", label: "3 PAYLOAD" },
      { key: "sides", type: "side_booster", label: "+ BOOSTERS" },
    ];
    const SIDE_IDS = ["side-booster-left", "side-booster-right"];
    const EMPTY_BUILD = () => ({ s1: null, upper: null, payload: null, sides: false });

    const state = {
      todIndex: 0,
      phase: "assemble",
      step: "s1",
      build: EMPTY_BUILD(),
      history: [],
      swapSlot: null,
      missionChoice: null,
    };
    let KIT = null;

    const $ = (id) => document.getElementById(id);
    const plate = $("plate"), plateWrap = $("plateWrap"), stackEl = $("stack"), worldEl = $("world");
    const skyExt = $("skyExt"), fxCanvas = $("fxCanvas"), countdownHud = $("countdownHud");
    const meta = $("meta"), todRow = $("todRow"), stepsEl = $("steps"), trayEl = $("tray"), reasonEl = $("reason");
    // tray scroll affordance (edge fades + arrows when more pieces are off-screen)
    trayEl.addEventListener("scroll", () => updateTrayHint(), { passive: true });
    window.addEventListener("resize", () => updateTrayHint());
    $("trayL").addEventListener("click", () => trayEl.scrollBy({ left: -Math.round(trayEl.clientWidth * 0.7), behavior: "smooth" }));
    $("trayR").addEventListener("click", () => trayEl.scrollBy({ left: Math.round(trayEl.clientWidth * 0.7), behavior: "smooth" }));
    $("buildLabel").textContent = APP_VER;

    /* ---------- friend-trial: first-screen hint (once) ---------- */
    const LS = { get: (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } },
                 set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };
    const hintEl = $("firstHint");
    function hideHint() {
      if (!hintEl.classList.contains("on")) return;
      hintEl.classList.remove("on");
      LS.set("rb_hint_seen", "1");
    }
    if (!LS.get("rb_hint_seen") && !new URLSearchParams(location.search).has("capture")) hintEl.classList.add("on");
    $("hintOk").addEventListener("click", hideHint);

    /* ---------- friend-trial: feedback -> Firestore (create-only rules) ---------- */
    const FB_COOLDOWN_MS = 30000;
    const fbMod = () => import("./firebase-init.js?v=" + APP_VER); // shared module (feedback now, leaderboard later)
    const fbModal = $("fbModal"), fbText = $("fbText"), fbName = $("fbName"), fbStatus = $("fbStatus"), fbSend = $("fbSend");
    const fbSet = (t, c) => { fbStatus.textContent = t || ""; fbStatus.className = c || ""; };
    function openFeedback() {
      fbSet(""); fbSend.disabled = false; fbModal.classList.add("on");
      const nm = LS.get("rb_fb_name"); if (nm && !fbName.value) fbName.value = nm;
      setTimeout(() => fbText.focus(), 50);
    }
    $("fbBtn").addEventListener("click", openFeedback);
    $("fbCancel").addEventListener("click", () => fbModal.classList.remove("on"));
    fbModal.addEventListener("click", (e) => { if (e.target === fbModal) fbModal.classList.remove("on"); });
    fbText.addEventListener("input", () => { $("fbCount").textContent = fbText.value.length + " / 1000"; });
    fbSend.addEventListener("click", async () => {
      const text = fbText.value.trim().slice(0, 1000), name = fbName.value.trim().slice(0, 40);
      if (!text) { fbSet("Type a few words first.", "err"); return; }
      const last = +(LS.get("rb_fb_last") || 0), wait = FB_COOLDOWN_MS - (Date.now() - last);
      if (wait > 0) { fbSet(`Thanks! Please wait ${Math.ceil(wait / 1000)} s before sending again.`, "err"); return; }
      fbSend.disabled = true; fbSet("Sending…");
      try {
        const M = await fbMod();
        const { db, fs } = await M.getDb();
        const b = state.build, cid = M.clientId();
        const stack = (idsOf(b).join(",") + (b.sides ? "+sides" : "")).slice(0, 200);
        const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
        const device = `${screen.width}x${screen.height}@${(window.devicePixelRatio || 1).toFixed(2)} vp ${innerWidth}x${innerHeight}${standalone ? " standalone" : ""}`.slice(0, 120);
        const data = { text, build: APP_VER, tod: String(TODS[state.todIndex].id), stack, ua: navigator.userAgent.slice(0, 400),
          device, clientTs: Date.now(), cid, createdAt: fs.serverTimestamp() };
        if (name) data.name = name;
        const batch = fs.writeBatch(db);
        M.stampThrottle(fs, db, batch, cid);
        batch.set(fs.doc(fs.collection(db, "feedback")), data);
        await batch.commit();
        LS.set("rb_fb_last", String(Date.now())); if (name) LS.set("rb_fb_name", name);
        fbText.value = ""; $("fbCount").textContent = "0 / 1000";
        fbSet("Sent — thank you!", "ok");
        setTimeout(() => { if (fbStatus.className === "ok") fbModal.classList.remove("on"); }, 1400);
      } catch (e) {
        console.warn("[feedback] send failed", e);
        fbSet(/permission/i.test(String(e && e.code || e)) ? "Too many sends — try again in a minute." : "Couldn't send (offline?). Please try again.", "err");
      } finally { fbSend.disabled = false; }
    });
    const launchBtn = $("launchBtn"), assembleUI = $("assembleUI"), opsEl = $("ops"), chromeEl = $("chrome");
    const missionBox = $("missionBox"), outcomeBox = $("outcomeBox"), stackHud = $("stackHud"), phaseHud = $("phaseHud");

    function todFromHour(h) {
      if (h >= 6 && h <= 8) return 0;
      if (h >= 17 && h <= 18) return 1;
      if (h >= 19 || h <= 4) return 2;
      if (h === 5) return 0;
      return 3;
    }
    state.todIndex = todFromHour(new Date().getHours());
    const QS = new URLSearchParams(location.search);
    if (QS.get("tod")) { const i = TODS.findIndex((t) => t.id === QS.get("tod")); if (i >= 0) state.todIndex = i; }
    plate.addEventListener("load", () => { applyPlateMap(); });

    TODS.forEach((t, i) => {
      const b = document.createElement("button");

    function plateMap() {
      const nw = plate.naturalWidth || NATIVE_W;

      stackEl.style.top = (lb.top - head) + "px";

      const portrait = lb.ch > lb.cw;
      let tf = "";
      if (p === "assemble" && portrait) {
        const cfg = padCfg(TODS[state.todIndex].id);

          const s = Math.max(0.72, (chromeTop - 10) / feet);
          const ox = lb.left + cfg.cx * lb.scale;
          tf = `translate3d(${(ox * (1 - s)).toFixed(1)}px,0,0) scale(${s.toFixed(4)})`;
        }
      }
      worldEl.classList.add("assembleZoom");
      worldEl.style.transformOrigin = "0 0";
      worldEl.style.transform = tf;
      if (tf) plateWrap.classList.add("assembleOpen");
    }

    function setChrome() {
      const p = state.phase;
      assembleUI.style.display = p === "assemble" ? "flex" : "none";
      assembleUI.style.flexDirection = "column"; assembleUI.style.gap = "6px";
      chromeEl.classList.toggle("building", p === "assemble");
      opsEl.classList.toggle("on", p === "grounded");
      chromeEl.classList.toggle("liftoffHidden", p === "liftoff");
      const fb = !!state.flightBackdrop && (p === "mission" || p === "outcome");
      todRow.style.display = (p === "liftoff" || p === "grounded" || fb) ? "none" : "";
      meta.style.display = (p === "liftoff" || p === "assemble") ? "none" : "";
      $("hud").style.display = (p === "liftoff" || p === "grounded" || p === "assemble") ? "none" : "";
      missionBox.classList.toggle("on", p === "mission");
      $("fbBtn").classList.toggle("on", p === "assemble" || p === "mission" || p === "outcome");
      if (p !== "assemble") hideHint();
      outcomeBox.classList.toggle("on", p === "outcome");
      phaseHud.textContent = p.toUpperCase();
      stackHud.textContent = KIT ? (idsOf(state.build).map(lbl).join(" + ") || "\u2014") : "";
      launchBtn.disabled = !(KIT && isComplete(state.build) && !validate(state.build, 0));
      plateWrap.classList.toggle("liftoffClimb", p === "liftoff" || fb);
    }

    function renderOps(activeIdx) {
      const steps = ["CHECKS", "FUEL", "STATIC FIRE", "COUNTDOWN"];
      opsEl.innerHTML = "";
      steps.forEach((label, i) => {
        const d = document.createElement("div");
        d.className = "op" + (i < activeIdx ? " done" : i === activeIdx ? " run" : "");
        d.textContent = label;
        opsEl.appendChild(d);
      });
    }

    function render() {
      const tod = TODS[state.todIndex];
      const src = plateSrc();
      if (plate.getAttribute("src") !== src) {
        plate.onload = () => { applyAssembleFrame(); paintStack(); };
        plate.src = src;
      } else paintStack();
      meta.textContent = `${tod.id} ${tod.label} \u00b7 ${state.phase.toUpperCase()} \u00b7 modular build`;
      [...todRow.children].forEach((b, i) => b.classList.toggle("active", i === state.todIndex));
      renderBuilder();
      setChrome();
      applyAssembleFrame();
      history.replaceState(null, "", `${location.search}#${tod.id}-${state.phase}`);
    }

    $("clearBtn").onclick = () => {
      if (state.phase !== "assemble") return;
      if (state.build.s1) state.history.push(state.build);
      state.build = EMPTY_BUILD(); state.step = "s1"; state.swapSlot = null;
      rebuildRocket(null); render();
    };
    $("undoBtn").onclick = () => {
      if (state.phase !== "assemble" || !state.history.length) return;
      const cur = state.build;
      state.build = state.history.pop(); state.swapSlot = null;
      const b = state.build;
      state.step = !b.s1 ? "s1" : !b.upper ? "upper" : isComplete(b) ? state.step : "payload";
      rebuildRocket(null);
      render();
      setReason("Undo \u00b7 " + summaryLine(), "");
      void cur;
    };

    async function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

    const soundBtn = $("soundBtn");
    let liftoffEngine = null;
    function getLiftoff() {
      if (liftoffEngine) return liftoffEngine;
      const API = window.RocketBayLiftoff;
      if (!API) { console.warn("liftoff.js missing"); return null; }
      liftoffEngine = new API.LiftoffEngine({
        captureMode: QS.has("capture"),
        getLetterbox: () => plateMap(),
        getParallaxEl: () => $("parallax"),
        getSeat: () => {
          const cfg = padCfg(TODS[state.todIndex].id);
          return Object.assign({}, lastSeat, { cx: cfg.cx, sitY: cfg.sitY, deckY: cfg.deckY, nozzleY: cfg.sitY + (cfg.nozzleOffsetY || 0),
            smokeY: cfg.smokeOriginY != null ? cfg.smokeOriginY : cfg.deckY });
        },
        getTodId: () => TODS[state.todIndex].id,
        getWorldEl: () => worldEl,
        getSkyEl: () => skyExt,
        getFxCanvas: () => fxCanvas,
        getCountdownEl: () => countdownHud,
        getStackEl: () => stackEl,
        getPlateEl: () => plate,
        onComplete: () => {
          state.phase = "mission";
          state.flightBackdrop = true;
          clearStackOverlay();
          render();
        },
        onPerfSample: (samples) => { window.__liftoffPerf = samples; },
      });
      window.__liftoffCapture = {
        start: () => { const e = getLiftoff(); if (e) e.startCapture(); },
        step: (dt) => { const e = getLiftoff(); if (e) e.captureStep(dt || 1 / 60); },
        running: () => !!(liftoffEngine && liftoffEngine.running),
        state: () => window.__liftoffState,
      };
      return liftoffEngine;
    }

    soundBtn.onclick = () => {
      const eng = getLiftoff();
      const muted = !(soundBtn.textContent.indexOf("OFF") >= 0);
      soundBtn.textContent = muted ? "SOUND OFF" : "SOUND ON";
      soundBtn.classList.toggle("on", !muted);
      if (eng) {
        eng.ensureAudio();
        if (eng.audio && eng.audio.ctx.state === "suspended") eng.audio.ctx.resume().catch(() => {});
        eng.setMuted(muted);
      }
    };

    launchBtn.onclick = async () => {
      if (launchBtn.disabled || state.phase !== "assemble") return;
      state.swapSlot = null;
      if (rocket) rocket.anim = null;
      state.phase = "grounded";
      render();
      renderOps(0); await sleep(280);
      renderOps(1); await sleep(280);
      renderOps(2); await sleep(280);
      renderOps(3); await sleep(200);
      worldEl.classList.remove("assembleZoom");
      worldEl.style.transform = "";
      plateWrap.classList.remove("assembleOpen");
      state.phase = "liftoff";
      setChrome();
      paintStack();
      const eng = getLiftoff();
      if (!eng) { state.phase = "mission"; render(); return; }
      eng.audioMuted = soundBtn.textContent.indexOf("OFF") >= 0;
      eng.start();
    };

    function finishMission(choice) {
      state.missionChoice = choice;
      state.phase = "outcome";
      const b = state.build;
      const base = 62 + Math.floor(Math.random() * 18);
      const score = Math.min(99, base + (b.sides ? 8 : 0) + (choice === "explore" ? 5 : 3));
      $("outcomeScore").textContent = `ROCKET SCORE ${score}`;
      $("outcomeText").textContent = choice === "deploy"
        ? `${b.payload ? lbl(b.payload) : lbl(b.upper)} deployed from ${lbl(b.s1)}. Clean separation.`
        : `${lbl(b.s1)} / ${lbl(b.upper)} coasting \u2014 explore path locked in.`;
      render();
    }
    $("deployBtn").onclick = () => finishMission("deploy");
    $("exploreBtn").onclick = () => finishMission("explore");
    $("restartBtn").onclick = () => {
      if (liftoffEngine) liftoffEngine.reset();
      state.flightBackdrop = false;
      state.phase = "assemble";
      state.missionChoice = null;
      worldEl.style.transform = "";
      skyExt.style.opacity = "0";
      countdownHud.style.display = "none";
      fxCanvas.style.display = "none";
      rebuildRocket(null);
      render();
    };

    window.addEventListener("resize", () => { applyPlateMap(); if (state.phase !== "liftoff") { applyAssembleFrame(); paintStack(); } });
    render();
    MB.loadKit("kit/modular/", KIT_VER).then((k) => {
      KIT = k;
      window.__kit = k;
      // dev/capture convenience: ?build=s1,upper[,payload]&sides=1
      if (QS.get("build")) {
        const ids = QS.get("build").split(",");
        const b = EMPTY_BUILD();
        ids.forEach((id) => { const t = k.metas[id] && k.metas[id].type; if (t === "first_stage") b.s1 = id; else if (t === "upper") b.upper = id; else if (t === "payload") b.payload = id; });
        b.sides = QS.get("sides") === "1";
        state.build = b; state.step = isComplete(b) ? "sides" : (b.upper ? "payload" : b.s1 ? "upper" : "s1");
      }
      rebuildRocket(null);
      render();
    }).catch((e) => { console.error(e); setReason("Kit failed to load", "warn"); });
  </script>
</body>
</html>
