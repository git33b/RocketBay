<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Rocket Bay — live compose</title>
  <style>
    :root { color-scheme: dark; --accent: #ff8c00; --cyan: #00c8e0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: #000; color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden; user-select: none;
    }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    #plateWrap {
      position: relative; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    #plate {
      width: 100%; height: 100%;
      object-fit: contain; object-position: center;
      background: #000; display: block;
    }
    #stack {
      position: absolute; pointer-events: none;
      image-rendering: auto;
      display: none;
      transform-origin: 50% 100%;
      /* never translucent / blended — flames may keep screen */
      opacity: 1;
      mix-blend-mode: normal;
    }
    #stack.on { display: block; }
    #stack.liftoff {
      transition: transform 2.1s cubic-bezier(0.33, 0, 0.67, 1), opacity 0.4s 1.6s;
      transform: translateY(-118%);
      opacity: 0;
    }
    #fx {
      position: absolute; inset: 0; pointer-events: none;
      display: none; align-items: flex-end; justify-content: center;
    }
    #fx.on { display: flex; }
    #flames {
      width: min(28vw, 180px); height: min(40vh, 260px);
      margin-bottom: 8%;
      background:
        radial-gradient(ellipse at 50% 0%, #fff 0%, #ffe566 18%, #ff8c00 45%, #ff3b00 70%, transparent 78%),
        radial-gradient(ellipse at 35% 10%, #ffcc66 0%, transparent 55%),
        radial-gradient(ellipse at 65% 10%, #ffaa33 0%, transparent 55%);
      filter: blur(1px);
      animation: roar 0.12s infinite alternate;
      opacity: 0.95;
      mix-blend-mode: screen;
    }
    @keyframes roar {
      from { transform: scaleY(0.92) scaleX(0.96) translateY(4px); opacity: 0.85; }
      to { transform: scaleY(1.08) scaleX(1.04) translateY(-6px); opacity: 1; }
    }
    #plateWrap.shake { animation: shake 0.45s linear infinite; }
    @keyframes shake {
      0%, 100% { transform: translate(0,0); }
      25% { transform: translate(-3px, 2px); }
      50% { transform: translate(3px, -2px); }
      75% { transform: translate(-2px, -1px); }
    }
    #hud {
      position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 10px; right: 10px;
      display: flex; justify-content: space-between; gap: 8px; pointer-events: none;
    }
    #hud .pill {
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px; padding: 6px 8px; font-size: 10px; line-height: 1.35;
      max-width: 58%;
    }
    #chrome {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,.92) 28%);
      display: flex; flex-direction: column; gap: 8px;
      max-height: 48vh; overflow: auto;
    }
    .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; align-items: center; }
    button, .chip {
      appearance: none; border: 0; border-radius: 6px;
      padding: 9px 11px; font: inherit; font-size: 11px; font-weight: 700;
      color: #fff; background: rgba(255,255,255,.14); cursor: pointer;
    }
    button.active, .chip.active { background: rgba(255,140,0,.92); }
    button.primary { background: rgba(255,140,0,.92); min-width: 140px; }
    button.primary:disabled { background: rgba(120,120,120,.45); cursor: not-allowed; }
    button.cyan { background: rgba(0,180,220,.45); }
    button.ghost { background: rgba(255,255,255,.1); }
    #tabs button { min-width: 72px; }
    #cards {
      display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px;
      -webkit-overflow-scrolling: touch;
    }
    .card {
      flex: 0 0 auto; width: 108px; padding: 6px;
      background: rgba(255,255,255,.1); border-radius: 8px;
      border: 2px solid transparent; text-align: center;
    }
    .card.selected { border-color: var(--cyan); background: rgba(0,200,224,.22); }
    .card img {
      width: 100%; height: 64px; object-fit: contain; display: block;
      image-rendering: auto; background: rgba(0,0,0,.25); border-radius: 4px;
    }
    .card .name { font-size: 10px; margin-top: 5px; line-height: 1.2; font-weight: 700; }
    #ops {
      display: none; gap: 6px; flex-wrap: wrap; justify-content: center;
    }
    #ops.on { display: flex; }
    .op {
      font-size: 10px; padding: 6px 8px; border-radius: 999px;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
    }
    .op.done { background: rgba(40,180,90,.35); border-color: rgba(80,220,120,.5); }
    .op.run { background: rgba(255,140,0,.35); border-color: var(--accent); }
    #missionBox, #outcomeBox { display: none; flex-direction: column; gap: 8px; align-items: center; }
    #missionBox.on, #outcomeBox.on { display: flex; }
    #outcomeBox .score {
      font-size: 18px; font-weight: 900; letter-spacing: .06em; color: #ffe08a;
    }
    #meta { text-align: center; font-size: 10px; opacity: .8; letter-spacing: .03em; }
    #todRow button { min-width: 64px; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="plateWrap">
      <img id="plate" alt="Rocket Bay pad" draggable="false" />
      <canvas id="stack" width="1" height="1" aria-hidden="true"></canvas>
      <div id="fx"><div id="flames"></div></div>
      <div id="hud">
        <div class="pill" id="stackHud">Select parts</div>
        <div class="pill" id="phaseHud">ASSEMBLE</div>
      </div>
    </div>
  </div>

  <div id="chrome">
    <div id="meta"></div>
    <div class="row" id="todRow"></div>

    <div id="assembleUI">
      <div class="row" id="tabs"></div>
      <div id="cards"></div>
      <div class="row">
        <button type="button" class="ghost" id="clearBtn">CLEAR</button>
        <button type="button" class="primary" id="launchBtn" disabled>GO FOR LAUNCH</button>
      </div>
    </div>

    <div id="ops" class="row" aria-label="Pad ops"></div>

    <div id="missionBox">
      <div class="row">
        <button type="button" class="cyan" id="deployBtn">Deploy payload</button>
        <button type="button" class="cyan" id="exploreBtn">Explore the universe</button>
      </div>
    </div>

    <div id="outcomeBox">
      <div class="score" id="outcomeScore"></div>
      <div id="outcomeText" style="font-size:12px;opacity:.9;text-align:center"></div>
      <button type="button" class="primary" id="restartBtn">FLY AGAIN</button>
    </div>
  </div>

  <script>
    const NATIVE_W = 1280, NATIVE_H = 720;
    const SIT_Y = 548, TARGET_H = 500;
    const CX = { "02": 556, "03": 685, "04": 717, "05": 634 };
    const KIT_VER = "compose2";
    const PAD_VER = "compose2";

    const TODS = [
      { id: "02", label: "SUNRISE", file: "sunrise", hourHint: [6, 7, 8] },
      { id: "03", label: "SUNSET", file: "sunset", hourHint: [17, 18] },
      { id: "04", label: "NIGHT", file: "night", hourHint: [19, 20, 21, 22, 23, 0, 1, 2, 3, 4] },
      { id: "05", label: "DAY", file: "day", hourHint: [9, 10, 11, 12, 13, 14, 15, 16] },
    ];

    const PARTS = {
      s1: [
        { id: "moon-giant", name: "Moon Giant", role: "s1" },
        { id: "pencil-core", name: "Pencil Core", role: "s1" },
      ],
      s2: [
        { id: "euro-core", name: "Euro Core", role: "s2" },
      ],
      payload: [
        { id: "orange-tank", name: "Orange Tank", role: "payload" },
      ],
      boosters: [
        { id: "gridfin-booster", name: "Gridfin Booster", role: "boosters" },
        { id: "steel-booster", name: "Steel Booster", role: "boosters" },
      ],
    };
    const ROLE_TABS = [
      { key: "s1", label: "1ST STAGE" },
      { key: "s2", label: "2ND STAGE" },
      { key: "payload", label: "PAYLOAD" },
      { key: "boosters", label: "BOOSTERS" },
    ];

    const state = {
      todIndex: 0,
      phase: "assemble",
      tab: "s1",
      selected: {
        s1: PARTS.s1[0],
        s2: PARTS.s2[0],
        payload: PARTS.payload[0],
        boosters: null, // start without steel so s1 is visible; user can pick Steel
      },
      missionChoice: null,
    };

    const plate = document.getElementById("plate");
    const plateWrap = document.getElementById("plateWrap");
    const stackEl = document.getElementById("stack");
    const fx = document.getElementById("fx");
    const meta = document.getElementById("meta");
    const todRow = document.getElementById("todRow");
    const tabs = document.getElementById("tabs");
    const cards = document.getElementById("cards");
    const launchBtn = document.getElementById("launchBtn");
    const assembleUI = document.getElementById("assembleUI");
    const opsEl = document.getElementById("ops");
    const missionBox = document.getElementById("missionBox");
    const outcomeBox = document.getElementById("outcomeBox");
    const stackHud = document.getElementById("stackHud");
    const phaseHud = document.getElementById("phaseHud");

    const imgCache = new Map();
    function loadImage(src) {
      if (imgCache.has(src)) return imgCache.get(src);
      const p = new Promise((resolve, reject) => {
        const im = new Image();
        im.decoding = "async";
        im.onload = async () => {
          try { if (im.decode) await im.decode(); } catch (_) {}
          resolve(im);
        };
        im.onerror = () => reject(new Error("fail " + src));
        im.src = src;
      });
      imgCache.set(src, p);
      return p;
    }

    function todFromHour(h) {
      if (h >= 6 && h <= 8) return 0;
      if (h >= 17 && h <= 18) return 1;
      if (h >= 19 || h <= 4) return 2;
      if (h === 5) return 0;
      return 3;
    }
    state.todIndex = todFromHour(new Date().getHours());

    TODS.forEach((t, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t.label;
      b.addEventListener("click", () => { state.todIndex = i; render(); });
      todRow.appendChild(b);
    });

    ROLE_TABS.forEach((t) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.tab = t.key;
      b.textContent = t.label;
      b.addEventListener("click", () => { state.tab = t.key; renderCards(); renderTabs(); });
      tabs.appendChild(b);
    });

    function usesEmptyPad() {
      const p = state.phase;
      return p === "assemble" || p === "grounded" || p === "liftoff";
    }

    function plateSrc() {
      const tod = TODS[state.todIndex];
      if (usesEmptyPad()) {
        // CoE PASS empty-pad-v2 PNG (never grounded/assemble baked rocket)
        return `plates/empty/${tod.id}-empty-pad-v2.png?v=${PAD_VER}`;
      }
      return `plates/${tod.id}-mission-${tod.file}.jpg`;
    }

    function kitSrc(partId) {
      const tod = TODS[state.todIndex].id;
      return `kit/opaque/lit/${tod}/${partId}.png?v=${KIT_VER}`;
    }

    function opaqueSrc(partId) {
      const tod = TODS[state.todIndex].id;
      return `kit/opaque/lit/${tod}/${partId}.png?v=${KIT_VER}`;
    }

    function canLaunch() {
      return !!(state.selected.s1 && state.selected.s2 && state.selected.payload);
    }

    function hasAnyParts() {
      const s = state.selected;
      return !!(s.s1 || s.s2 || s.payload || s.boosters);
    }

    function stackSummary() {
      const s = state.selected;
      if (!hasAnyParts()) return "Select parts";
      const bits = [s.s1?.name || "—", s.s2?.name || "—", s.payload?.name || "—"];
      let line = bits.join(" / ");
      if (s.boosters) {
        if (s.boosters.id === "steel-booster") line += " + Steel Booster / Steel Ship";
        else line += ` + ${s.boosters.name}`;
      }
      return line;
    }

    function letterboxRect() {
      const nw = plate.naturalWidth || NATIVE_W;
      const nh = plate.naturalHeight || NATIVE_H;
      const cw = plate.clientWidth;
      const ch = plate.clientHeight;
      if (!cw || !ch) return null;
      const scale = Math.min(cw / nw, ch / nh);
      const dw = nw * scale;
      const dh = nh * scale;
      const plateOffX = plate.offsetLeft;
      const plateOffY = plate.offsetTop;
      const left = plateOffX + (cw - dw) / 2;
      const top = plateOffY + (ch - dh) / 2;
      return { left, top, width: dw, height: dh, scale, nw, nh };
    }

    /** Opaque-alpha content bbox of an Image/canvas (source pixels). */
    function contentBBox(img) {
      const w = img.naturalWidth || img.width;
      const h = img.naturalHeight || img.height;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0);
      let data;
      try { data = ctx.getImageData(0, 0, w, h).data; }
      catch { return { x0: 0, y0: 0, x1: w - 1, y1: h - 1, cw: w, ch: h }; }
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (data[(y * w + x) * 4 + 3] > 8) {
            if (x < x0) x0 = x;
            if (y < y0) y0 = y;
            if (x > x1) x1 = x;
            if (y > y1) y1 = y;
          }
        }
      }
      if (x1 < 0) return { x0: 0, y0: 0, x1: w - 1, y1: h - 1, cw: w, ch: h };
      return { x0, y0, x1, y1, cw: x1 - x0 + 1, ch: y1 - y0 + 1 };
    }

    /** Draw sprite so content bottom sits on sitY and content height ≈ targetH. */
    function drawSeated(ctx, img, cx, sitY, targetH) {
      const bb = contentBBox(img);
      const scale = targetH / bb.ch;
      const dw = bb.cw * scale;
      const dh = bb.ch * scale;
      const dx = cx - dw / 2;
      const dy = sitY - dh; // content bottom == sitY
      ctx.drawImage(
        img,
        bb.x0, bb.y0, bb.cw, bb.ch,
        Math.round(dx), Math.round(dy), Math.round(dw), Math.round(dh)
      );
      return { dx: Math.round(dx), dy: Math.round(dy), dw: Math.round(dw), dh: Math.round(dh), bb, scale };
    }

    let composeToken = 0;

    function clearStackOverlay() {
      composeToken++;
      stackEl.classList.remove("on", "liftoff");
      stackEl.style.display = "none";
      stackEl.style.transform = "";
      stackEl.style.opacity = "";
      // wipe bitmap synchronously so late draws can't leave a ghost
      try {
        const w = stackEl.width;
        stackEl.width = w; // reset clears
        const ctx = stackEl.getContext("2d");
        if (ctx) ctx.clearRect(0, 0, stackEl.width, stackEl.height);
      } catch (_) {}
      stackEl.width = 1;
      stackEl.height = 1;
    }

    async function buildStackCanvas(nativeW, nativeH, token) {
      const off = document.createElement("canvas");
      off.width = nativeW;
      off.height = nativeH;
      const ctx = off.getContext("2d");
      ctx.clearRect(0, 0, nativeW, nativeH);
      // never use globalAlpha
      ctx.globalAlpha = 1;

      const tod = TODS[state.todIndex].id;
      const cx = CX[tod];
      const sitY = SIT_Y;
      const targetH = TARGET_H;
      const sel = state.selected;
      const boost = sel.boosters;

      async function getPart(id) {
        try {
          return await loadImage(opaqueSrc(id));
        } catch {
          return await loadImage(`kit/opaque/${id}.png?v=${KIT_VER}`);
        }
      }

      if (token !== composeToken) return null;

      // --- Steel mode: only when steel-booster selected AND s1 is null ---
      // (mutual exclusion enforced on pick; this is a safety net)
      if (boost?.id === "steel-booster" && !sel.s1) {
        let pre = null;
        try { pre = await getPart("steel-booster-ship"); } catch (_) {}
        if (token !== composeToken) return null;
        if (pre) {
          drawSeated(ctx, pre, cx, sitY, targetH);
          return off;
        }
        const booster = await getPart("steel-booster");
        if (token !== composeToken) return null;
        let ship;
        try { ship = await getPart("steel-ship"); }
        catch { ship = await loadImage(`kit/opaque/steel-ship.png?v=${KIT_VER}`); }
        if (token !== composeToken) return null;

        // Compose booster+ship into temp then seat by content bbox
        const tmp = document.createElement("canvas");
        const bhFrac = 0.62, shFrac = 0.46;
        const bh = Math.round(targetH * bhFrac);
        const sh = Math.round(targetH * shFrac);
        const bbb = contentBBox(booster);
        const sbb = contentBBox(ship);
        const bw = Math.round(bbb.cw * (bh / bbb.ch));
        const sw = Math.round(sbb.cw * (sh / sbb.ch));
        const cw = Math.max(bw, sw) + 4;
        tmp.width = cw;
        tmp.height = targetH;
        const sctx = tmp.getContext("2d");
        sctx.globalAlpha = 1;
        sctx.drawImage(booster, bbb.x0, bbb.y0, bbb.cw, bbb.ch, (cw - bw) / 2, targetH - bh, bw, bh);
        sctx.drawImage(ship, sbb.x0, sbb.y0, sbb.cw, sbb.ch, (cw - sw) / 2, 0, sw, sh);
        drawSeated(ctx, tmp, cx, sitY, targetH);
        return off;
      }

      // --- Core body from s1 (Moon Giant / Pencil Core) — never overridden by steel ---
      let coreId = sel.s1?.id || null;
      if (!coreId && boost?.id === "gridfin-booster") coreId = "gridfin-booster";
      if (!coreId && sel.s2) coreId = sel.s2.id;
      if (!coreId && sel.payload) coreId = sel.payload.id;
      if (!coreId) return off;

      const core = await getPart(coreId);
      if (token !== composeToken) return null;

      // Gridfin sides around current s1 (or gridfin body if no s1 / core is gridfin)
      if (boost?.id === "gridfin-booster") {
        let side = null;
        try { side = await getPart("side-boost"); } catch (_) { side = null; }
        if (token !== composeToken) return null;

        if (side && sel.s1) {
          const cbb = contentBBox(core);
          const sbb = contentBBox(side);
          const coreScale = targetH / cbb.ch;
          const coreW = Math.round(cbb.cw * coreScale);
          const coreH = targetH;
          const sh = Math.round(targetH * 0.92);
          const sw = Math.round(sbb.cw * (sh / sbb.ch));
          const gap = Math.max(2, Math.round(sw / 8));
          const canvasW = coreW + 2 * (sw + gap);
          const g = document.createElement("canvas");
          g.width = canvasW;
          g.height = targetH;
          const gctx = g.getContext("2d");
          gctx.globalAlpha = 1;
          gctx.drawImage(side, sbb.x0, sbb.y0, sbb.cw, sbb.ch, 0, targetH - sh, sw, sh);
          gctx.drawImage(core, cbb.x0, cbb.y0, cbb.cw, cbb.ch, (canvasW - coreW) / 2, 0, coreW, coreH);
          gctx.save();
          gctx.translate(canvasW, 0);
          gctx.scale(-1, 1);
          gctx.drawImage(side, sbb.x0, sbb.y0, sbb.cw, sbb.ch, 0, targetH - sh, sw, sh);
          gctx.restore();
          drawSeated(ctx, g, cx, sitY, targetH);
          return off;
        }

        // No side sprite or no s1: draw gridfin / core seated
        const gf = coreId === "gridfin-booster" ? core : await getPart("gridfin-booster");
        if (token !== composeToken) return null;
        drawSeated(ctx, gf, cx, sitY, targetH);
        return off;
      }

      // Plain core (Moon Giant / Pencil Core / etc.)
      drawSeated(ctx, core, cx, sitY, targetH);
      return off;
    }

    async function paintStack() {
      const token = ++composeToken;
      const show = usesEmptyPad() && hasAnyParts();

      if (!show) {
        clearStackOverlay();
        // clearStackOverlay bumps token again — that's fine
        return;
      }

      // Clear previous frame immediately to avoid ghost while loading
      try {
        const ctx0 = stackEl.getContext("2d");
        if (ctx0) ctx0.clearRect(0, 0, stackEl.width, stackEl.height);
      } catch (_) {}

      const lb = letterboxRect();
      if (!lb || !plate.naturalWidth) {
        return;
      }

      try {
        const composed = await buildStackCanvas(lb.nw, lb.nh, token);
        if (token !== composeToken) return; // stale
        if (!composed) return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        stackEl.width = Math.round(lb.width * dpr);
        stackEl.height = Math.round(lb.height * dpr);
        stackEl.style.left = lb.left + "px";
        stackEl.style.top = lb.top + "px";
        stackEl.style.width = lb.width + "px";
        stackEl.style.height = lb.height + "px";
        stackEl.style.transform = "";
        stackEl.style.opacity = "1";
        stackEl.style.display = "block";
        stackEl.classList.add("on");
        if (state.phase !== "liftoff") stackEl.classList.remove("liftoff");

        const ctx = stackEl.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, lb.width, lb.height);
        ctx.drawImage(composed, 0, 0, lb.width, lb.height);

        if (state.phase === "liftoff") {
          const tod = TODS[state.todIndex].id;
          const cx = CX[tod];
          const flameX = lb.left + (cx / lb.nw) * lb.width;
          const flameY = lb.top + (SIT_Y / lb.nh) * lb.height;
          fx.style.alignItems = "flex-start";
          fx.style.justifyContent = "flex-start";
          const flames = document.getElementById("flames");
          flames.style.position = "absolute";
          flames.style.left = (flameX - flames.offsetWidth / 2) + "px";
          flames.style.top = (flameY - 8) + "px";
          flames.style.marginBottom = "0";
        }
      } catch (e) {
        console.warn("compose failed", e);
      }
    }

    function renderTabs() {
      [...tabs.children].forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
    }

    function selectPart(p) {
      if (state.phase !== "assemble") return;
      // toggle off
      if (state.selected[p.role]?.id === p.id) {
        state.selected[p.role] = null;
        return;
      }
      state.selected[p.role] = p;
      // Mutual exclusion: Steel Booster ↔ s1 (Moon Giant / Pencil Core)
      if (p.role === "boosters" && p.id === "steel-booster") {
        state.selected.s1 = null;
      }
      if (p.role === "s1") {
        if (state.selected.boosters?.id === "steel-booster") {
          state.selected.boosters = null;
        }
      }
    }

    function renderCards() {
      cards.innerHTML = "";
      PARTS[state.tab].forEach((p) => {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "card" + (state.selected[p.role]?.id === p.id ? " selected" : "");
        el.innerHTML = `<img alt="" src="${kitSrc(p.id)}" /><div class="name">${p.name}</div>`;
        el.addEventListener("click", () => {
          selectPart(p);
          render();
        });
        cards.appendChild(el);
      });
    }

    function setChrome() {
      const p = state.phase;
      assembleUI.style.display = p === "assemble" ? "block" : "none";
      opsEl.classList.toggle("on", p === "grounded" || p === "liftoff");
      missionBox.classList.toggle("on", p === "mission");
      outcomeBox.classList.toggle("on", p === "outcome");
      fx.classList.toggle("on", p === "liftoff");
      plateWrap.classList.toggle("shake", p === "liftoff");
      phaseHud.textContent = p.toUpperCase();
      stackHud.textContent = stackSummary();
      launchBtn.disabled = !canLaunch();
    }

    function renderOps(activeIdx) {
      const steps = ["CHECKS", "FUEL", "STATIC FIRE", "COUNTDOWN"];
      opsEl.innerHTML = "";
      steps.forEach((label, i) => {
        const d = document.createElement("div");
        d.className = "op" + (i < activeIdx ? " done" : i === activeIdx ? " run" : "");
        d.textContent = label;
        opsEl.appendChild(d);
      });
    }

    function render() {
      const tod = TODS[state.todIndex];
      const src = plateSrc();
      const prev = plate.getAttribute("src");
      if (prev !== src) {
        plate.onload = () => paintStack();
        plate.src = src;
      } else {
        paintStack();
      }
      meta.textContent = `${tod.id} ${tod.label} · ${state.phase.toUpperCase()} · live compose`;
      [...todRow.children].forEach((b, i) => b.classList.toggle("active", i === state.todIndex));
      renderTabs();
      renderCards();
      setChrome();
      history.replaceState(null, "", `#${tod.id}-${state.phase}`);
    }

    document.getElementById("clearBtn").onclick = () => {
      state.selected = { s1: null, s2: null, payload: null, boosters: null };
      clearStackOverlay();
      setChrome();
      render();
    };

    async function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

    launchBtn.onclick = async () => {
      if (!canLaunch() || state.phase !== "assemble") return;
      state.phase = "grounded";
      render();
      renderOps(0);
      for (let i = 0; i < 4; i++) {
        renderOps(i);
        await sleep(550);
      }
      renderOps(4);
      await sleep(350);
      state.phase = "liftoff";
      render();
      requestAnimationFrame(() => {
        stackEl.classList.add("liftoff");
      });
      await sleep(2200);
      state.phase = "mission";
      stackEl.classList.remove("liftoff");
      clearStackOverlay();
      render();
    };

    function finishMission(choice) {
      state.missionChoice = choice;
      state.phase = "outcome";
      const base = 62 + Math.floor(Math.random() * 18);
      const boost = state.selected.boosters ? 8 : 0;
      const score = Math.min(99, base + boost + (choice === "explore" ? 5 : 3));
      document.getElementById("outcomeScore").textContent = `ROCKET SCORE ${score}`;
      document.getElementById("outcomeText").textContent =
        choice === "deploy"
          ? `${state.selected.payload?.name || "Payload"} deployed from ${state.selected.s1?.name || "stack"}. Clean separation.`
          : `${state.selected.s1?.name || "Stack"} / ${state.selected.s2?.name || ""} coasting — explore path locked in.`;
      render();
    }

    document.getElementById("deployBtn").onclick = () => finishMission("deploy");
    document.getElementById("exploreBtn").onclick = () => finishMission("explore");
    document.getElementById("restartBtn").onclick = () => {
      state.phase = "assemble";
      state.missionChoice = null;
      state.selected = {
        s1: PARTS.s1[0],
        s2: PARTS.s2[0],
        payload: PARTS.payload[0],
        boosters: null,
      };
      state.todIndex = todFromHour(new Date().getHours());
      clearStackOverlay();
      render();
    };

    window.addEventListener("resize", () => paintStack());
    render();
  </script>
</body>
</html>
